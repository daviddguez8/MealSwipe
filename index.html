<title>MealSwipe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column swipe deck on phones; plan + grocery list side by side on desktop.
   Colors are RGB channels so Tailwind opacity modifiers (bg-good/15) work. */
:root {
  --bg: 244 246 243; --surface: 255 255 255; --ink: 24 33 29; --muted: 92 106 99;
  --line: 222 228 224; --chip: 236 240 237; --accent: 222 76 40; --onaccent: 255 255 255;
  --good: 30 145 96; --warn: 190 120 20; --danger: 206 50 62; --pass: 206 50 62; --scrim: 10 14 12;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: 15 20 18; --surface: 26 33 30; --ink: 236 241 238; --muted: 156 170 163;
  --line: 45 55 51; --chip: 35 44 40; --accent: 255 118 80; --onaccent: 26 12 8;
  --good: 70 196 140; --warn: 240 176 70; --danger: 255 104 112; --pass: 255 104 112; --scrim: 0 0 0;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: 15 20 18; --surface: 26 33 30; --ink: 236 241 238; --muted: 156 170 163;
  --line: 45 55 51; --chip: 35 44 40; --accent: 255 118 80; --onaccent: 26 12 8;
  --good: 70 196 140; --warn: 240 176 70; --danger: 255 104 112; --pass: 255 104 112; --scrim: 0 0 0;
  color-scheme: dark; }
html, body { height: 100%; }
body { background: rgb(var(--bg)); color: rgb(var(--ink)); font-family: var(--font-body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 45; background: rgb(var(--bg)); }
#root { min-height: 100%; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.text-balance { text-wrap: balance; }
@keyframes sheetIn { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-in { animation: sheetIn 220ms cubic-bezier(.2,.8,.3,1); }
.bg-scrim { background: rgb(var(--scrim) / .45); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; } }
#boot { display:flex; align-items:center; justify-content:center; min-height:60vh; font-family: var(--font-display); color: rgb(var(--muted)); }
</style>

ck beans with a pinch of salt. Char the frozen corn in a hot dry skillet for 5 to 6 minutes.","Make a quick pico: dice the tomatoes and half the red onion, then mix with the remaining cilantro and a pinch of salt.","Sear or grill the steak over high heat, 4 to 5 minutes per side for medium-rare. Rest it 5 minutes, then slice thinly against the grain.","Build the bowls with rice, beans, corn, steak, pico, sliced avocado and a spoonful of sour cream."],ingredients:[{name:"flank steak",qty:1.5,unit:"lb",aisle:"Meat/Seafood"},{name:"long-grain white rice",qty:1.5,unit:"cup",aisle:"Pantry & Grains"},{name:"black beans (15 oz)",qty:1,unit:"can",aisle:"Pantry & Grains"},{name:"frozen corn",qty:1.5,unit:"cup",aisle:"Frozen"},{name:"roma tomato",qty:3,unit:"",aisle:"Produce"},{name:"red onion",qty:1,unit:"",aisle:"Produce"},{name:"avocado",qty:2,unit:"",aisle:"Produce"},{name:"lime",qty:3,unit:"",aisle:"Produce"},{name:"orange",qty:1,unit:"",aisle:"Produce"},{name:"garlic",qty:4,unit:"clove",aisle:"Produce"},{name:"cilantro",qty:1,unit:"bunch",aisle:"Produce"},{name:"sour cream",qty:.5,unit:"cup",aisle:"Dairy & Eggs"},{name:"ground cumin",qty:1,unit:"tsp",aisle:"Spices/Other"},{name:"chili powder",qty:1,unit:"tsp",aisle:"Spices/Other"},{name:"olive oil",qty:3,unit:"tbsp",aisle:"Pantry & Grains"},{name:"salt",qty:1.5,unit:"tsp",aisle:"Spices/Other"}]},{id:"s-sweet-potato-enchiladas",title:"Sweet Potato & Black Bean Enchiladas",cuisine:"Mexican",emoji:"\u{1F360}",prepMin:20,cookMin:35,servings:4,description:"Hearty vegetarian enchiladas stuffed with roasted sweet potato, black beans and spinach under bubbling cheese.",steps:["Heat the oven to 425\xB0F. Peel and dice the sweet potatoes into \xBD-inch cubes, toss with the olive oil, cumin, chili powder and salt, and roast 20 minutes until tender.","Meanwhile, saut\xE9 the diced onion in a skillet until soft, about 5 minutes. Add the garlic and spinach and cook until the spinach wilts.","Mash about a third of the roasted sweet po
