<title>MealSwipe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column swipe deck on phones; plan + grocery list side by side on desktop.
   Colors are RGB channels so Tailwind opacity modifiers (bg-good/15) work. */
:root {
  --bg: 244 246 243; --surface: 255 255 255; --ink: 24 33 29; --muted: 92 106 99;
  --line: 222 228 224; --chip: 236 240 237; --accent: 222 76 40; --onaccent: 255 255 255;
  --good: 30 145 96; --warn: 190 120 20; --danger: 206 50 62; --pass: 206 50 62; --scrim: 10 14 12;
  --ai: 214 165 32; --onai: 43 30 0;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: 15 20 18; --surface: 26 33 30; --ink: 236 241 238; --muted: 156 170 163;
  --line: 45 55 51; --chip: 35 44 40; --accent: 255 118 80; --onaccent: 26 12 8;
  --good: 70 196 140; --warn: 240 176 70; --danger: 255 104 112; --pass: 255 104 112; --scrim: 0 0 0;
  --ai: 232 190 72; --onai: 36 26 0;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: 15 20 18; --surface: 26 33 30; --ink: 236 241 238; --muted: 156 170 163;
  --line: 45 55 51; --chip: 35 44 40; --accent: 255 118 80; --onaccent: 26 12 8;
  --good: 70 196 140; --warn: 240 176 70; --danger: 255 104 112; --pass: 255 104 112; --scrim: 0 0 0;
  --ai: 232 190 72; --onai: 36 26 0;
  color-scheme: dark; }
html, body { height: 100%; }
body { background: rgb(var(--bg)); color: rgb(var(--ink)); font-family: var(--font-body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 45; background: rgb(var(--bg)); }
#root { min-height: 100%; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.text-balance { text-wrap: balance; }
@keyframes sheetIn { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-in { animation: sheetIn 220ms cubic-bezier(.2,.8,.3,1); }
.bg-scrim { background: rgb(var(--scrim) / .45); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; } }
#boot { display:flex; align-items:center; justify-content:center; min-height:60vh; font-family: var(--font-display); color: rgb(var(--muted)); }
</style>

 chicken thighs. Cover and simmer on medium-low for 18 to 20 minutes, until the chicken is cooked through (165\xB0F).","Shred the chicken in the pan with two forks and stir it into the sauce. Simmer uncovered 3 to 5 minutes until thick.","Warm the tortillas in a dry skillet or wrapped in a damp towel in the microwave.","Fill the tortillas with tinga and top with sliced avocado, crumbled cotija, cilantro and a squeeze of lime."],ingredients:[{name:"boneless skinless chicken thighs",qty:1.5,unit:"lb",aisle:"Meat/Seafood"},{name:"yellow onion",qty:1,unit:"",aisle:"Produce"},{name:"garlic",qty:3,unit:"clove",aisle:"Produce"},{name:"chipotles in adobo (7 oz)",qty:1,unit:"can",aisle:"Pantry & Grains"},{name:"fire-roasted diced tomatoes (14.5 oz)",qty:1,unit:"can",aisle:"Pantry & Grains"},{name:"corn tortilla",qty:12,unit:"",aisle:"Pantry & Grains"},{name:"avocado",qty:2,unit:"",aisle:"Produce"},{name:"cotija cheese",qty:2,unit:"oz",aisle:"Dairy & Eggs"},{name:"cilantro",qty:1,unit:"bunch",aisle:"Produce"},{name:"lime",qty:2,unit:"",aisle:"Produce"},{name:"dried oregano",qty:1,unit:"tsp",aisle:"Spices/Other"},{name:"olive oil",qty:1,unit:"tbsp",aisle:"Pantry & Grains"},{name:"salt",qty:1,unit:"tsp",aisle:"Spices/Other"}]},{id:"s-carne-asada-bowls",title:"Carne Asada Burrito Bowls",cuisine:"Mexican",emoji:"\u{1F969}",prepMin:20,cookMin:20,servings:4,description:"Citrus-marinated grilled steak over rice with beans, charred corn, quick pico and avocado.",steps:["Make the marinade: juice 2 limes and the orange, then whisk with 2 tbsp olive oil, the garlic, cumin, chili powder, 1 tsp salt and half the chopped cilantro. Marinate the steak at least 15 minutes (or overnight in the fridge).","Cook the rice according to the package. Stir in the juice of the last lime and a little chopped cilantro.","Warm the black beans with a pinch of salt. Char the frozen corn in a hot dry skillet for 5 to 6 minutes.","Make a quick pico: dice the tomatoes and half the red onion, then mix with the remaining cilantro and a pinch of salt.","Sear or grill the steak over high heat, 4 to 5 minutes per side for medium-rare. Rest it 5 minutes, then slice thinly against the grain.","Build the bowls with rice, beans, corn, steak, pico, sliced avocado and a spoonful of sour cream."],ingredients:[{name:"flank steak",qty:1.5,unit:"lb",aisle:"Meat/Seafood"},{name:"long-grain white rice",qty:1.5,unit:"cup",aisle:"Pantry & Grains"},{name:"black beans (15 oz)",qty:1,unit:"can",aisle:"Pantry & Grains"},{name:"frozen corn",qty:1.5,unit:"cup",aisle:"Frozen"},{name:"roma tomato",qty:3,unit:"",aisle:"Produce"},{name:"red onion",qty:1,unit:"",aisle:"Produce"},{name:"avocado",qty:2,unit:"",aisle:"Produce"},{name:"lime",qty:3,unit:"",aisle:"Produce"},{name:"orange",qty:1,unit:"",aisle:"Produce"},{name:"garlic",qty:4,unit:"clove",aisle:"Produce"},{name:"cilantro",qty:1,unit:"bunch",aisle:"Produce"},{name:"sour cream",qty:.5,unit:"cup",aisle:"Dairy & Eggs"},{name:"ground cumin",qty:1,unit:"tsp",aisle:"Spices/Other"},{name:"chili powder",qty:1,unit:"tsp",aisle:"Spices/Other"},{name:"olive oil",qty:3,unit:"tbsp",aisle:"Pantry & Grains"},{name:"salt",qty:1.5,unit:"tsp",aisle:"Spices/Other"}]},{id:"s-sweet-potato-enchiladas",title:"Sweet Potato & Black Bean Enchiladas",cuisine:"Mexican",emoji:"\u{1F360}",prepMin:20,cookMin:35,servings:4,description:"Hearty vegetarian enchiladas stuffed with roasted sweet potato, black beans and spinach under bubbling cheese.",steps:["Heat the oven to 425\xB0F. Peel and dice the sweet potatoes into \xBD-inch cubes, toss with the olive oil, cumin, chili powder and salt, and roast 20 minutes until tender.","Meanwhile, saut\xE9 the diced onion in a skillet until soft, about 5 minutes. Add the garlic and spinach and cook until the spinach wilts.","Mash about a third of the roasted sweet potato, then fold in the rest with the drained black beans, the onion mixture and half the cheese.","Lower the oven to 375\xB0F. Spread \xBD cup enchilada sauce in a 9x13 baking dish.","Fill each tortilla with the filling, roll it up, and lay it seam-side down in the dish. Pour the remaining sauce over and top with the rest of the cheese.","Bake 15 to 20 minutes until bubbly. Top with chopped cilantro before serving."],ingredients:[{name:"sweet potato",qty:2,unit:"",aisle:"Produce"},{name:"black beans (15 oz)",qty:1,unit:"can",aisle:"Pantry & Grains"},{name:"red enchilada sauce (19 oz)",qty:1,unit:"can",aisle:"Pantry & Grains"},{name:"flour tortilla (8 inch)",qty:8,unit:"",aisle:"Pantry & Grains"},{name:"shredded Mexican-blend cheese",qty:8,unit:"oz",aisle:"Dairy & Eggs"},{name:"baby spinach",qty:3,unit:"oz",aisle:"Produce"},{name:"yellow onion",qty:1,unit:"",aisle:"Produce"},{name:"garlic",qty:2,unit:"clove",aisle:"Produce"},{name:"cilantro",qty:1,unit:"bunch",aisle:"Produce"},{name:"ground cumin",qty:1,unit:"tsp",aisle:"Spices/Other"},{name:"chili powder",qty:1,unit:"tsp",aisle:"Spices/Other"},{name:"olive oil",qty:1,unit:"tbsp",aisle:"Pantry & Grains"},{name:"salt",qty:1,unit:"tsp",aisle:"Spices/Other"}]},{id:"s-shrimp-fajitas",title:"Sheet-Pan Shrimp Fajitas",cuisine:"Mexican",emoji:"\u{1F364}",prepMin:15,cookMin:15,servings:4,description:"Everything roasts on one pan in under 20 minutes. Peppers get charred edges, shrimp stays juicy.",steps:["Heat the oven to 450\xB0F and line a sheet pan with foil or parchment.","Slice the bell peppers and onion into thin strips. Mix the chili powder, cumin, smoked paprika, garlic powder and salt.","Toss the vegetables with 1 tbsp oil and half the spice mix, spread them on the pan, and roast 8 minutes.","Toss the shrimp with the remaining oil and spices. Push the vegetables aside, add the shrimp in one layer, and roast 6 to 8 minutes until the shrimp are pink.","Squeeze one lime over everything. Warm the tortillas.","Serve with sliced avocado, sour cream and lime wedges."],ingredients:[{name:"large shrimp, peeled and deveined",qty:1.5,unit:"lb",aisle:"Meat/Seafood"},{name:"bell pepper",qty:3,unit:"",aisle:"Produce"},{name:"yellow onion",qty:1,unit:"",aisle:"Produce"},{name:"flour tortilla (8 inch)",qty:8,unit:"",aisle:"Pantry & Grains"},{name:"avocado",qty:1,unit:"",aisle:"Produce"},{name:"lime",qty:2,unit:"",aisle:"Produce"},{name:"sour cream",qty:.5,unit:"cup",aisle:"Dairy & Eggs"},{name:"chili powder",qty:2,unit:"tsp",aisle:"Spices/Other"},{name:"ground cumin",qty:1,unit:"tsp",aisle:"Spices/Other"},{name:"smoked paprika",qty:1,unit:"tsp",aisle:"Spices/Other"},{name:"garlic powder",qty:1,unit:"tsp",aisle:"Spices/Other"},{name:"olive oil",qty:2,unit:"tbsp",aisle:"Pantry & Grains"},{name:"salt",qty:1,unit:"tsp",aisle:"Spices/Other"}]},{id:"s-tuscan-sausage-pasta",title:"Creamy Tuscan Sausage Pasta",cuisine:"Italian",emoji:"\u{1F35D}",prepMin:10,cookMin:25,servings:4,description:"Rich, creamy one-skillet sauce with sausage, sun-dried tomatoes and spinach tossed with rigatoni.",steps:["Bring a large pot of salted water to a boil and cook the rigatoni 1 minute short of the package time. Save \xBD cup of pasta water, then drain.","While the pasta cooks, brown the sausage (casings removed) in a large skillet over medium-high heat, breaking it up, about 6 to 7 minutes.","Add the garlic, chopped sun-dried tomatoes and crushed red pepper and cook 1 minute.","Pour in the chicken broth and scrape up the browned bits. Stir in the cream and simmer 3 to 4 minutes until slightly thickened.","Add the spinach a handful at a time until wilted, then stir in the grated parmesan.","Toss in the pasta, loosening with pasta water as needed. Season with salt and serve with extra parmesan."],ingredients:[{name:"Italian sausage",qty:1,unit:"lb",aisle:"Meat/Seafood"},{name:"rigatoni",qty:12,unit:"oz",aisle:"Pantry & Grains"},{name:"sun-dried tomatoes in oil",qty:.5,unit:"cup",aisle:"Pantry & Grains"},{name:"baby spinach",qty:5,unit:"oz",aisle:"Produce"},{name:"garlic",qty:4,unit:"clove",aisle:"Produce"},{name:"heavy cream",qty:1,unit:"cup",aisle:"Dairy & Eggs"},{name:"parmesan cheese",qty:2,unit:"oz",aisle:"Dairy & Eggs"},{name:"chicken broth",qty:1,unit:"cup",aisle:"Pantry & Grains"},{name:"crushed red pepper",qty:.5,unit:"tsp",aisle:"Spices/Other"},{name:"salt",qty:1,unit:"tsp",aisle:"Spices/Other"}]},{id:"s-weeknight-bolognese",title:"Weeknight Spaghetti Bolognese",cuisine:"Italian",emoji:"\u{1F345}",prepMin:15,cookMin:40,servings:6,description:"A shortcut rag\xF9 with real depth from tomato paste and a splash of milk. Makes 6 servings, so plan on leftovers.",steps:["Finely chop the onion, carrots and celery (or pulse them in a food processor).","Heat the olive oil in a large pot over medium heat. Cook the vegetables with a pinch of salt until soft, about 8 minutes. Add the garlic for the last minute.","Add the ground beef, raise the heat, and brown it well, breaking it up, about 7 minutes.","Stir in the tomato paste and cook 2 minutes until it darkens. Add the milk and simmer until it's mostly absorbed.","Add the crushed tomatoes, oregano and remaining salt. Simmer partially covered for 20 to 25 minutes, stirring now and then.","Cook the spaghetti in salted water. Toss with the sauce and a splash of pasta water, then top with grated parmesan."],ingredients:[{name:"ground beef (85% lean)",qty:1,unit:"lb",aisle:"Meat/Seafood"},{name:"spaghetti",qty:1,unit:"lb",aisle:"Pantry & Grains"},{name:"crushed tomatoes (28 oz)",qty:1,unit:"can",aisle:"Pantry & Grains"},{name:"tomato paste",qty:2,unit:"tbsp",aisle:"Pantry & Grains"},{name:"yellow onion",qty:1,unit:"",aisle:"Produce"},{name:"carrot",qty:2,unit:"",aisle:"Produce"},{name:"celery",qty:2,unit:"stalk",aisle:"Produce"},{name:"garlic",qty:3,unit:"clove",aisle:"Produce"},{name:"whole milk",qty:.5,unit:"cup",aisle:"Dairy & Eggs"},{name:"parmesan cheese",qty:2,unit:"oz",aisle:"Dairy & Eggs"},{name:"dried oregano",qty:1,unit:"tsp",aisle:"Spices/Other"},{name:"olive oil",qty:2,unit:"tbsp",aisle:"Pantry & Grains"},{name:"salt",qty:1.5,unit:"tsp",aisle:"Spices/Other"}]},{id:"s-beef-broccoli",title:"Beef & Broccoli Stir-Fry",cuisine:"Chinese-American",emoji:"\u{1F966}",prepMin:15,cookMin:15,servings:4,description:"Takeout-style beef and broccoli with a glossy garlic-ginger sauce, faster than delivery.",steps:["Start the jasmine rice.","Slice the flank steak very thinly against the grain. Toss it with 1 tbsp soy sauce and 2 tsp cornstarch.","Whisk the sauce: remaining soy sauce, brown sugar, remaining cornstarch, grated ginger, minced garlic and \xBD cup water.","Cut the broccoli into florets. Steam-fry in a hot wok or skillet with a splash of water, covered, for 3 minutes. Remove.","Heat the oil until shimmering and sear the beef in batches, 1 to 2 minutes per side. Don't crowd the pan.","Return the broccoli, pour in the sauce, and toss for 1 to 2 minutes until glossy and thick. Serve over rice with sliced green onions and sesame seeds."],ingredients:[{name:"flank steak",qty:1.25,unit:"lb",aisle:"Meat/Seafood"},{name:"broccoli crowns",qty:1.5,unit:"lb",aisle:"Produce"},{name:"jasmine rice",qty:1.5,unit:"cup",aisle:"Pantry & Grains"},{name:"low-sodium soy sauce",qty:.33,unit:"cup",aisle:"Pantry & Grains"},{name:"brown sugar",qty:2,unit:"tbsp",aisle:"Pantry & Grains"},{name:"cornstarch",qty:1,unit:"tbsp",aisle:"Pantry & Grains"},{name:"garlic",qty:3,unit:"clove",aisle:"Produce"},{name:"fresh ginger (1 inch)",qty:1,unit:"piece",aisle:"Produce"},{name:"green onions",qty:1,unit:"bunch",aisle:"Produce"},{name:"sesame seeds",qty:1,unit:"tbsp",aisle:"Spices/Other"},{name:"vegetable oil",qty:2,unit:"tbsp",aisle:"Pantry & Grains"}]},{id:"s-thai-red-curry",title:"Thai Red Curry Chicken",cuisine:"Thai",emoji:"\u{1F35B}",prepMin:15,cookMin:20,servings:4,description:"Coconut red curry with tender chicken, peppers and peas, finished with basil and lime.",steps:["Start the jasmine rice. Cut the chicken into bite-size pieces and slice the onion and peppers.","Heat the oil in a large pot over medium-high. Fry the curry paste for 1 minute, stirring, until fragrant.","Add the thickest part of the coconut milk (the cream at the top of the can) and stir until it bubbles and the oil separates, about 2 minutes.","Add the chicken and onion and cook 3 minutes, then add the rest of the coconut milk, the fish sauce and brown sugar.","Simmer 8 to 10 minutes until the chicken is cooked. Add the peppers and frozen peas for the last 3 minutes.","Turn off the heat, stir in torn basil and the lime juice, and taste for salt. Serve over rice."],ingredients:[{name:"boneless skinless chicken thighs",qty:1.5,unit:"lb",aisle:"Meat/Seafood"},{name:"coconut milk (13.5 oz)",qty:2,unit:"can",aisle:"Pantry & Grains"},{name:"red curry paste",qty:3,unit:"tbsp",aisle:"Pantry & Grains"},{name:"jasmine rice",qty:1.5,unit:"cup",aisle:"Pantry & Grains"},{name:"bell pepper",qty:2,unit:"",aisle:"Produce"},{name:"yellow onion",qty:1,unit:"",aisle:"Produce"},{name:"fresh basil",qty:1,unit:"bunch",aisle:"Produce"},{name:"lime",qty:1,unit:"",aisle:"Produce"},{name:"frozen peas",qty:1,unit:"cup",aisle:"Frozen"},{name:"fish sauce",qty:1,unit:"tbsp",aisle:"Pantry & Grains"},{name:"brown sugar",qty:1,unit:"tbsp",aisle:"Pantry & Grains"},{name:"vegetable oil",qty:1,unit:"tbsp",aisle:"Pantry & Grains"}]},{id:"s-greek-sheet-pan-chicken",title:"Greek Sheet-Pan Chicken & Potatoes",cuisine:"Mediterranean",emoji:"\u{1FAD2}",prepMin:15,cookMin:35,servings:4,description:"Lemon-oregano chicken roasted with crispy potatoes and onions, served with a quick tzatziki and a feta-olive salad.",steps:["Heat the oven to 425\xB0F. Halve the potatoes and cut the red onion into wedges.","Whisk 3 tbsp olive oil with the juice of 1 lemon, 3 cloves of minced garlic, the oregano and 1\xBD tsp salt.","Toss the chicken, potatoes and onion in the marinade and spread them on a large sheet pan with the potatoes cut-side down.","Roast 30 to 35 minutes until the chicken reaches 165\xB0F and the potatoes are golden. Add the cherry tomatoes for the last 10 minutes.","Meanwhile, make tzatziki: grate half the cucumber, squeeze out the water, and mix with the yogurt, the last garlic clove, a squeeze of lemon and a pinch of salt.","Chop the rest of the cucumber and toss it with the olives, crumbled feta and remaining oil. Serve with the chicken, tzatziki and lemon wedges."],ingredients:[{name:"boneless skinless chicken thighs",qty:2,unit:"lb",aisle:"Meat/Seafood"},{name:"baby potatoes",qty:1.5,unit:"lb",aisle:"Produce"},{name:"cherry tomatoes",qty:1,unit:"pint",aisle:"Produce"},{name:"English cucumber",qty:1,unit:"",aisle:"Produce"},{name:"red onion",qty:1,unit:"",aisle:"Produce"},{name:"lemon",qty:2,unit:"",aisle:"Produce"},{name:"garlic",qty:4,unit:"clove",aisle:"Produce"},{name:"plain Greek yogurt",qty:1,unit:"cup",aisle:"Dairy & Eggs"},{name:"feta cheese",qty:4,unit:"oz",aisle:"Dairy & Eggs"},{name:"kalamata olives",qty:.5,unit:"cup",aisle:"Pantry & Grains"},{name:"dried oregano",qty:2,unit:"tsp",aisle:"Spices/Other"},{name:"olive oil",qty:4,unit:"tbsp",aisle:"Pantry & Grains"},{name:"salt",qty:2,unit:"tsp",aisle:"Spices/Other"}]},{id:"s-chana-masala",title:"Chana Masala",cuisine:"Indian",emoji:"\u{1F9C6}",prepMin:10,cookMin:30,servings:4,description:"A warm, tangy chickpea curry that tastes even better the next day. Vegetarian and very budget-friendly.",steps:["Start the basmati rice.","Heat the oil in a large skillet over medium heat. Cook the finely diced onion until deep golden, 8 to 10 minutes. Don't rush this step, because it builds the flavor.","Add the garlic, grated ginger and minced jalape\xF1o and cook 1 minute.","Stir in the garam masala, cumin and turmeric and toast 30 seconds.","Add the crushed tomatoes and salt and simmer 5 minutes. Add the drained chickpeas and \xBD cup water, and simmer 12 to 15 minutes, mashing a few chickpeas to thicken.","Finish with a squeeze of lemon or extra garam masala if you like. Serve over rice with a dollop of yogurt and chopped cilantro."],ingredients:[{name:"chickpeas (15 oz)",qty:2,unit:"can",aisle:"Pantry & Grains"},{name:"crushed tomatoes (28 oz)",qty:1,unit:"can",aisle:"Pantry & Grains"},{name:"basmati rice",qty:1.5,unit:"cup",aisle:"Pantry & Grains"},{name:"yellow onion",qty:1,unit:"",aisle:"Produce"},{name:"garlic",qty:4,unit:"clove",aisle:"Produce"},{name:"fresh ginger (1 inch)",qty:1,unit:"piece",aisle:"Produce"},{name:"jalape\xF1o",qty:1,unit:"",aisle:"Produce"},{name:"cilantro",qty:1,unit:"bunch",aisle:"Produce"},{name:"plain Greek yogurt",qty:.5,unit:"cup",aisle:"Dairy & Eggs"},{name:"garam masala",qty:2,unit:"tsp",aisle:"Spices/Other"},{name:"ground cumin",qty:1,unit:"tsp",aisle:"Spices/Other"},{name:"ground turmeric",qty:.5,unit:"tsp",aisle:"Spices/Other"},{name:"vegetable oil",qty:2,unit:"tbsp",aisle:"Pantry & Grains"},{name:"salt",qty:1.5,unit:"tsp",aisle:"Spices/Other"}]},{id:"s-honey-garlic-salmon",title:"Honey Garlic Salmon & Green Beans",cuisine:"American",emoji:"\u{1F41F}",prepMin:10,cookMin:15,servings:4,description:"Sticky honey-garlic glazed salmon with blistered green beans and fluffy quinoa.",steps:["Rinse the quinoa and simmer it in 2 cups water, covered, for 15 minutes. Let it rest 5 minutes and fluff.","Heat the oven to 400\xB0F. Toss the green beans with the olive oil, salt and pepper on a sheet pan.","Melt the butter in a small pan with the minced garlic for 1 minute. Stir in the honey, soy sauce and the juice of half the lemon.","Pat the salmon dry, set it on the pan next to the beans, and brush it generously with the glaze.","Roast 12 to 15 minutes until the salmon flakes easily. Brush with more glaze halfway through.","Spoon any remaining glaze over the top and serve with quinoa and lemon wedges."],ingredients:[{name:"salmon fillets",qty:1.5,unit:"lb",aisle:"Meat/Seafood"},{name:"green beans",qty:1,unit:"lb",aisle:"Produce"},{name:"quinoa",qty:1,unit:"cup",aisle:"Pantry & Grains"},{name:"honey",qty:3,unit:"tbsp",aisle:"Pantry & Grains"},{name:"low-sodium soy sauce",qty:2,unit:"tbsp",aisle:"Pantry & Grains"},{name:"garlic",qty:4,unit:"clove",aisle:"Produce"},{name:"
